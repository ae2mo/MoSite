# Lets Home Assistant install MoSite straight from GitHub:
# Settings > Apps > App Store > (three dots, top right) > Repositories >
# add https://github.com/ae2mo/MoSite
# The app itself is defined by config.yaml + Dockerfile in this same folder.
# Home Assistant only offers an update when the "version" in config.yaml
# changes, so bump it whenever you push changes you want installed.
name: MoSite
url: https://github.com/ae2mo/MoSite
maintainer: ae2mo
