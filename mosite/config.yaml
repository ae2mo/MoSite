# Home Assistant app definition for MoSite.
name: MoSite
version: "1.2.1"
slug: mosite
description: Budget planner, stock trader, meal planner and home/car maintenance logbook
url: https://github.com/ae2mo/MoSite
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: MoSite web page
webui: "http://[HOST]:[PORT:8000]/"
# Sidebar button. Opens the site inside Home Assistant (works remotely
# through Nabu Casa too). Turn it on/off with "Show in sidebar" on the
# app's Info page. panel_admin: false lets non-admin users see it as well.
ingress: true
ingress_port: 8000
panel_icon: mdi:currency-usd
panel_title: MoSite
panel_admin: false
# Your data lives in this app's persistent /config folder. It survives
# updates and is included in Home Assistant backups.
map:
  - type: app_config
    read_only: false
